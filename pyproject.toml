[project]
name = "pulse-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "vaderSentiment>=3.3,<4",
  "langdetect>=1.0.9,<2",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "respx>=0.22,<1", "openapi-spec-validator>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
